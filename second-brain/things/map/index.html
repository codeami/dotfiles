<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easywiki map</title>
<style>
:root{--bg:#f6f4ef;--panel:#fffdf8;--ink:#1c1b19;--muted:#6b675f;--line:#b9b3a6;--accent:#b4441f;--edge:#8a8478;--focus:#1f5fbf}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--panel:#201f1c;--ink:#ecE9e1;--muted:#a09b90;--line:#4a473f;--accent:#f08a5d;--edge:#7d776b;--focus:#7ab0ff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
h1{font-size:18px;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
.edge{stroke:var(--edge);stroke-width:1.5;fill:none}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.edgeg:hover .edge,.edgeg:focus .edge,.edgeg.sel .edge{stroke:var(--accent);stroke-width:2.5}
.dot{stroke:var(--accent);stroke-width:2}
.full .dot{fill:var(--accent)}
.stub .dot{fill:var(--bg)}
.nodeg{cursor:pointer}
.nodeg.sel .dot{stroke:var(--ink);stroke-width:3}
.nodeg text{fill:var(--ink);font-size:11px;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.nodeg:focus,.edgeg:focus{outline:none}
.nodeg:focus .dot,.edgeg:focus .edge{stroke:var(--focus);stroke-width:4}
.ctl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus)}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:bold}
.legend{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);vertical-align:-1px;margin-right:4px}
.legend i.f{background:var(--accent)}
aside{width:360px;max-width:45vw;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto}
aside h2{font-size:18px;margin:0 0 2px}
aside .kind{color:var(--muted);font-size:13px;margin:0 0 8px}
dl{margin:8px 0}
dt{font-weight:bold;text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:var(--muted);margin-top:8px}
dd{margin:0}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:8px 0}
.votes{border-top:1px solid var(--line);margin-top:12px;padding-top:8px;color:var(--muted);font-size:13px}
a{color:var(--accent)}
details.recipes{border-bottom:1px solid var(--line);margin:-14px -16px 12px;padding:8px 16px}
details.recipes summary{cursor:pointer;font-weight:bold}
details.recipes summary:focus-visible{outline:3px solid var(--focus)}
.recipes select{font:inherit;max-width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px}
.recipes ol{padding-left:0;list-style:none;margin:8px 0}
.recipes li{border-left:3px solid var(--line);padding:2px 0 6px 8px;margin-bottom:6px}
.recipes li.cur{border-left-color:var(--accent)}
.recipes li .stepbtn{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-weight:bold}
.recipes li p{margin:2px 0;font-size:13px}
.recipes .cite{color:var(--muted)}
.recipes .slot{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rpath{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 5;fill:none;pointer-events:none}
.badge circle{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.badge text{fill:var(--bg);font-size:11px;font-weight:bold;text-anchor:middle;stroke:none;paint-order:normal;pointer-events:none}
.badge{pointer-events:none}
@media (max-width:700px){
  main{flex-direction:column}
  aside{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line);max-height:48vh}
  .legend{top:auto;bottom:10px;right:10px}
}
</style>
</head>
<body>
<header>
  <h1>Easywiki map</h1>
  <p class="note">Nearby dots are linked in the cards. Votes: not open yet.</p>
  <p class="note">Inspired by Map of GitHub by Andrei Kashcha (anvaka), https://github.com/anvaka/map-of-github</p>
</header>
<main>
  <div id="stage">
    <svg id="svg" role="group" aria-label="Map of things. Tab to move between dots."><g id="world"><g id="edges"></g><g id="rpath"></g><g id="nodes"></g><g id="badges"></g></g></svg>
    <div class="ctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zfit" aria-label="Fit all dots">Fit</button>
    </div>
    <div class="legend"><i class="f"></i>card &nbsp; <i></i>stub</div>
  </div>
  <aside>
    <details class="recipes" id="recipes"><summary>Recipes</summary>
      <p class="note">A recipe solves a problem in three levels. Pick one, then a level.</p>
      <label class="note">Recipe <select id="rsel"></select></label>
      <p id="rproblem"></p>
      <div class="tabs" id="rlevels"></div>
      <ol id="rsteps"></ol>
    </details>
    <div id="panel" aria-live="polite"><p class="note">Pick a dot or a line.</p></div>
  </aside>
</main>

el for people and orgs, looks each up in an index file, and writes backlinks. Run it twice: the files must match."},{"cite":"data/pmle-rowboat-scout/report.md section 4, milestone step 2 and table","dot":"rowboat","exam":[{"name":"Evaluation and LLM-as-a-judge","section":"2.3","weight":"~16%"},{"name":"Evaluating gen AI","section":"6.2","weight":"~13%"}],"source":"source-backed","tag":"S","why":"Label 30 pairs as same or different entity. Score merge precision and recall. When unsure, do not merge."},{"cite":"data/pmle-rowboat-scout/report.md section 4, Google Cloud table","dot":"bigquery-ml","exam":[{"name":"Architecting low-code AI solutions","section":"1.1","weight":"~13%"}],"source":"source-backed","tag":"S","why":"Train a small ranker on exported note or email metadata, to sort what matters."},{"cite":"data/pmle-rowboat-scout/report.md section 4, Google Cloud table","dot":"agent-platform-pipelines","exam":[{"name":"Experiments and pipelines","section":"2.3","weight":"~16%"},{"name":"Automating and orchestrating ML pipelines","section":"5.1","weight":"~18%"}],"source":"source-backed","tag":"S","why":"Turn the training into a tracked, repeatable pipeline job."},{"cite":"data/pmle-rowboat-scout/report.md section 4, Google Cloud table","dot":"cloud-run","exam":[{"name":"Serving and scaling models","section":"4.1","weight":"~20%"}],"source":"source-backed","tag":"S","why":"Register the model and serve it behind a small API."},{"cite":"data/pmle-rowboat-scout/report.md section 4, Google Cloud table","dot":"model-monitoring","exam":[{"name":"Monitoring AI solutions","section":"6.2","weight":"~13%"}],"source":"source-backed","tag":"S","why":"Watch for drift in the queries and features."},{"cite":"data/pmle-rowboat-scout/report.md section 4 (the study route is the scout's judgement)","dot":"google-pmle-exam-guide","exam":[{"name":"Scaling prototypes into ML models","section":"3","weight":"~21%"}],"source":"model-drafted","tag":"M","why":"The heaviest section is hardware <script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("map-data").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var SLOTS = ["who", "what", "when", "where", "why", "how"];
  var svg = document.getElementById("svg");
  var world = document.getElementById("world");
  var panel = document.getElementById("panel");
  var byId = {};
  DATA.nodes.forEach(function (n, i) { byId[n.id] = n; n.i = i; });

  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    return e;
  }
  function h(tag, text, cls) {
    var e = document.createElement(tag);
    if (text) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  // ---- force layout (fixed start, fixed steps, so it looks the same each load)
  var N = DATA.nodes.length;
  DATA.nodes.forEach(function (n, i) {
    var a = (2 * Math.PI * i) / N;
    n.x = 300 * Math.cos(a); n.y = 300 * Math.sin(a); n.vx = 0; n.vy = 0;
  });
  var links = DATA.edges.map(function (e) { return [byId[e.from], byId[e.to]]; });
  for (var step = 0; step < 400; step++) {
    var cool = 1 - step / 400;
    DATA.nodes.forEach(function (a) {
      a.vx *= 0.6; a.vy *= 0.6;
      a.vx -= a.x * 0.004; a.vy -= a.y * 0.004;
      DATA.nodes.forEach(function (b) {
        if (a === b) return;
        var dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01, d = Math.sqrt(d2);
        var f = 9000 / d2;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      });
    });
    links.forEach(function (l) {
      var a = l[0], b = l[1], dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      var f = (d - 90) * 0.05;
      a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    });
    DATA.nodes.forEach(function (n) { n.x += n.vx * cool; n.y += n.vy * cool; });
  }

  // ---- draw
  var edgesG = document.getElementById("edges"), nodesG = document.getElementById("nodes");
  var edgeEls = [], nodeEls = [];
  DATA.edges.forEach(function (e, i) {
    var a = byId[e.from], b = byId[e.to];
    var g = el("g", { "class": "edgeg", tabindex: "0", role: "button",
                      "aria-label": "Link between " + a.name + " and " + b.name });
    g.appendChild(el("line", { "class": "edge", x1: a.x, y1: a.y, x2: b.x, y2: b.y }));
    g.appendChild(el("line", { "class": "hit", x1: a.x, y1: a.y, x2: b.x, y2: b.y }));
    g.addEventListener("click", function () { selectEdge(i); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectEdge(i); } });
    edgesG.appendChild(g); edgeEls.push(g);
  });
  DATA.nodes.forEach(function (n, i) {
    var g = el("g", { "class": "nodeg " + (n.stub ? "stub" : "full"), tabindex: "0", role: "button",
                      "aria-label": n.name + (n.stub ? ", stub, card not written yet" : ", card"),
                      transform: "translate(" + n.x.toFixed(1) + " " + n.y.toFixed(1) + ")" });
    g.appendChild(el("circle", { "class": "dot", r: n.stub ? 7 : 11 }));
    g.appendChild(el("text", { x: 14, y: 4 }, n.name));
    g.addEventListener("click", function () { selectNode(i); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(i); } });
    nodesG.appendChild(g); nodeEls.push(g);
  });

  // ---- pan and zoom (a view box we move)
  var view = { x: 0, y: 0, w: 800, h: 600 };
  function applyView() { svg.setAttribute("viewBox", [view.x, view.y, view.w, view.h].join(" ")); }
  function fit() {
    var r = svg.getBoundingClientRect(), pad = 90, minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    DATA.nodes.forEach(function (n) { minx = Math.min(minx, n.x); maxx = Math.max(maxx, n.x); miny = Math.min(miny, n.y); maxy = Math.max(maxy, n.y); });
    var w = maxx - minx + 2 * pad, hh = maxy - miny + 2 * pad, ratio = (r.width || 800) / (r.height || 600);
    if (w / hh < ratio) w = hh * ratio; else hh = w / ratio;
    view = { x: (minx + maxx) / 2 - w / 2, y: (miny + maxy) / 2 - hh / 2, w: w, h: hh };
    applyView();
  }
  function zoom(f, cx, cy) {
    var r = svg.getBoundingClientRect();
    var px = cx === undefined ? 0.5 : (cx - r.left) / r.width, py = cy === undefined ? 0.5 : (cy - r.top) / r.height;
    var nw = view.w * f, nh = view.h * f;
    view = { x: view.x + (view.w - nw) * px, y: view.y + (view.h - nh) * py, w: nw, h: nh };
    applyView();
  }
  svg.addEventListener("wheel", function (ev) { ev.preventDefault(); zoom(ev.deltaY > 0 ? 1.12 : 1 / 1.12, ev.clientX, ev.clientY); }, { passive: false });
  var drag = null;
  svg.addEventListener("pointerdown", function (ev) {
    if (ev.target.closest && ev.target.closest(".nodeg, .edgeg")) return;
    drag = { x: ev.clientX, y: ev.clientY }; svg.classList.add("drag"); svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    var r = svg.getBoundingClientRect();
    view.x -= (ev.clientX - drag.x) * view.w / r.width; view.y -= (ev.clientY - drag.y) * view.h / r.height;
    drag = { x: ev.clientX, y: ev.clientY }; applyView();
  });
  function endDrag() { drag = null; svg.classList.remove("drag"); }
  svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);
  document.getElementById("zin").onclick = function () { zoom(1 / 1.3); };
  document.getElementById("zout").onclick = function () { zoom(1.3); };
  document.getElementById("zfit").onclick = fit;
  window.addEventListener("resize", fit);

  // ---- side panel
  var mode = "product", current = null;
  function clearSel() {
    nodeEls.concat(edgeEls).forEach(function (e) { e.classList.remove("sel"); });
  }
  function selectNode(i) { clearSel(); nodeEls[i].classList.add("sel"); current = { node: i }; renderNode(); }
  function selectEdge(i) { clearSel(); edgeEls[i].classList.add("sel"); current = { edge: i }; renderEdge(); }
  function addUrl(box, url) {
    if (/^https:\/\//.test(url)) {
      var a = h("a", url); a.href = url; a.rel = "noreferrer noopener"; a.target = "_blank";
      var p = h("p"); p.appendChild(a); box.appendChild(p);
    } else { box.appendChild(h("p", "url: " + url, "note")); }
  }
  function renderNode() {
    var n = DATA.nodes[current.node];
    panel.textContent = "";
    panel.appendChild(h("h2", n.name));
    panel.appendChild(h("p", n.kind + (n.stub ? " · stub: " + n.note : " · card"), "kind"));
    addUrl(panel, n.url);
    if (n.stub) {
      panel.appendChild(h("p", n.line));
      var f = h("dl");
      Object.keys(n.facts).forEach(function (k) { f.appendChild(h("dt", k)); f.appendChild(h("dd", n.facts[k])); });
      panel.appendChild(f);
    } else {
      var tabs = h("div", "", "tabs");
      ["product", "tech"].forEach(function (m) {
        var b = h("button", m.toUpperCase()); b.setAttribute("aria-pressed", String(mode === m));
        b.onclick = function () { mode = m; renderNode(); }; tabs.appendChild(b);
      });
      panel.appendChild(tabs);
      var dl = h("dl");
      SLOTS.forEach(function (s) {
        var slot = n[mode][s]; dl.appendChild(h("dt", s));
        var dd = h("dd", slot ? slot.text : "unknown");
        if (slot) dd.appendChild(h("span", slot.source, "tag"));
        dl.appendChild(dd);
      });
      panel.appendChild(dl);
      if (mode === "tech") {
        var fd = h("dl");
        Object.keys(n.facts).sort().forEach(function (k) { fd.appendChild(h("dt", k)); fd.appendChild(h("dd", n.facts[k])); });
        panel.appendChild(fd);
      }
    }
    panel.appendChild(h("p", "Votes: not open yet.", "votes"));
  }
  function renderEdge() {
    var e = DATA.edges[current.edge];
    panel.textContent = "";
    panel.appendChild(h("h2", byId[e.from].name + " ↔ " + byId[e.to].name));
    panel.appendChild(h("p", "link", "kind"));
    var dl = h("dl");
    [["source", e.source], ["votes", String(e.votes)], ["why", e.why]].forEach(function (r) {
      dl.appendChild(h("dt", r[0])); dl.appendChild(h("dd", r[1]));
    });
    panel.appendChild(dl);
    panel.appendChild(h("p", "Votes: not open yet.", "votes"));
  }


  // ---- recipes: pick one, pick a level, the path shows on the map in order
  var RECIPES = DATA.recipes || [];
  var rsel = document.getElementById("rsel"), rsteps = document.getElementById("rsteps");
  var rlevels = document.getElementById("rlevels"), rproblem = document.getElementById("rproblem");
  var rpathG = document.getElementById("rpath"), badgesG = document.getElementById("badges");
  var rcur = { r: 0, level: "1", step: -1 };
  RECIPES.forEach(function (r, i) { var o = h("option", r.title); o.value = String(i); rsel.appendChild(o); });
  rsel.onchange = function () { rcur = { r: Number(rsel.value), level: rcur.level, step: -1 }; renderRecipe(); };

  function dotName(id) { return byId[id] ? byId[id].name : id; }
  function stepBox(st, k) {
    var li = h("li"); if (k === rcur.step) li.className = "cur";
    var b = h("button", (k + 1) + ". " + dotName(st.dot), "stepbtn");
    b.onclick = function () { rcur.step = k; renderRecipe(); selectNode(byId[st.dot].i); };
    li.appendChild(b);
    if (st.slot) li.appendChild(h("p", st.slot, "slot"));
    if (st.detail) li.appendChild(h("p", st.detail));
    li.appendChild(h("p", st.why));
    if (st.alternatives && st.alternatives.length) {
      st.alternatives.forEach(function (a) { li.appendChild(h("p", "Or: " + dotName(a.dot) + ". " + a.why)); });
    }
    (st.exam || []).forEach(function (x) { li.appendChild(h("p", "PMLE section " + x.section + " (" + x.weight + "): " + x.name)); });
    li.appendChild(h("p", "[" + st.tag + "] " + (st.tag === "S" ? "source-backed" : "model-drafted, you may overrule") + ". " + st.cite, "cite"));
    return li;
  }
  function drawPath(steps) {
    rpathG.textContent = ""; badgesG.textContent = "";
    var seen = {}, prev = null;
    steps.forEach(function (st, k) {
      var n = byId[st.dot];
      if (prev && prev !== n) rpathG.appendChild(el("line", { "class": "rpath", x1: prev.x, y1: prev.y, x2: n.x, y2: n.y }));
      prev = n; (seen[n.id] = seen[n.id] || { n: n, nums: [] }).nums.push(k + 1);
    });
    Object.keys(seen).forEach(function (id) {
      var o = seen[id], g = el("g", { "class": "badge", transform: "translate(" + (o.n.x - 12).toFixed(1) + " " + (o.n.y - 14).toFixed(1) + ")" });
      var label = o.nums.join(","), w = Math.max(9, label.length * 4 + 5);
      g.appendChild(el("circle", { r: w })); g.appendChild(el("text", { y: 4 }, label)); badgesG.appendChild(g);
    });
  }
  function renderRecipe() {
    var r = RECIPES[rcur.r]; if (!r) return;
    rproblem.textContent = "Problem: " + r.problem;
    rlevels.textContent = "";
    ["1", "2", "3"].forEach(function (lv) {
      var b = h("button", "Level " + lv); b.setAttribute("aria-pressed", String(rcur.level === lv));
      b.onclick = function () { rcur.level = lv; rcur.step = -1; renderRecipe(); }; rlevels.appendChild(b);
    });
    var level = r.levels[rcur.level];
    rsteps.textContent = "";
    rsteps.appendChild(h("li", level.title + ". " + level.steps.length + " steps, in order."));
    level.steps.forEach(function (st, k) { rsteps.appendChild(stepBox(st, k)); });
    drawPath(level.steps);
  }
  if (RECIPES.length) renderRecipe();

  fit();
})();
